<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico Gratuito — Gustavo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --bg-card:#131313;
    --yellow:#17a653;
    --yellow-dim:#0f7a3d;
    --text:#f5f5f0;
    --muted:#7a7a76;
    --border:#232320;
    --danger:#ff5d5d;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    width:100%;
    max-width:520px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- progresso ---------- */
  .progress{
    display:flex;
    gap:6px;
    padding:24px 24px 0 24px;
  }
  .progress .seg{
    flex:1;
    height:3px;
    border-radius:3px;
    background:var(--border);
    overflow:hidden;
  }
  .progress .seg i{
    display:block;
    height:100%;
    width:0%;
    background:var(--yellow);
    box-shadow:0 0 8px var(--yellow);
    transition:width .35s ease;
  }
  .progress .seg.done i{width:100%;}

  /* ---------- header ---------- */
  .header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:18px 24px 0 24px;
  }
  .avatar{
    width:34px; height:34px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fbffb0, var(--yellow));
    color:#0a0a0a;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    flex-shrink:0;
    overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .header-name{
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .header-name b{color:var(--text); font-weight:600;}

  /* ---------- stage: onde as telas trocam ---------- */
  .stage{
    flex:1;
    position:relative;
    padding:0 24px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .screen{
    position:absolute;
    left:24px; right:24px; top:50%;
    transform:translateY(calc(-50% + 14px));
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease, transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .screen.active{
    opacity:1;
    transform:translateY(-50%);
    pointer-events:auto;
  }
  .screen.leaving{
    opacity:0;
    transform:translateY(calc(-50% - 14px));
  }

  .bubble{
    display:inline-block;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:4px 18px 18px 18px;
    padding:16px 18px;
    margin-bottom:26px;
    max-width:92%;
  }
  .bubble p{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1.32;
    letter-spacing:-0.01em;
  }
  .bubble .sub{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:13.5px;
    color:var(--muted);
    margin-top:8px;
    line-height:1.5;
  }

  /* ---------- inputs ---------- */
  input[type="text"], input[type="tel"]{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:2px solid var(--border);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    font-size:24px;
    font-weight:500;
    padding:10px 2px 14px 2px;
    outline:none;
    transition:border-color .2s ease;
  }
  input::placeholder{color:#3d3d3a;}
  input:focus{border-color:var(--yellow);}

  .hint{
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
  }
  .hint.error{color:var(--danger);}

  /* ---------- opções ---------- */
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    text-align:left;
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    padding:15px 16px;
    border-radius:12px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover{border-color:var(--yellow-dim);}
  .opt:active{transform:scale(.985);}
  .opt.selected{
    border-color:var(--yellow);
    background:#1a1a08;
    box-shadow:0 0 0 1px var(--yellow) inset;
  }

  /* ---------- footer / CTA ---------- */
  .footer{
    padding:18px 24px 28px 24px;
  }
  .btn{
    width:100%;
    background:var(--yellow);
    color:#0a0a0a;
    border:none;
    border-radius:14px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px;
    cursor:pointer;
    box-shadow:0 0 24px rgba(23,166,83,.18);
    transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn:hover{box-shadow:0 0 32px rgba(23,166,83,.32);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{
    opacity:.35;
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13px;
    border:none;
    margin-top:12px;
    cursor:pointer;
    width:100%;
    padding:4px;
  }
  .btn-ghost:hover{color:var(--text);}

  /* ---------- welcome ---------- */
  .welcome{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
  }
  .welcome .avatar-big{
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fbffb0, var(--yellow));
    color:#0a0a0a;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .welcome .avatar-big img{width:100%; height:100%; object-fit:cover;}
  .welcome h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:28px;
    line-height:1.25;
    letter-spacing:-0.01em;
    margin-bottom:14px;
  }
  .welcome h1 span{color:var(--yellow);}
  .welcome p{
    font-size:15px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:6px;
  }

  /* ---------- sucesso ---------- */
  .success{
    text-align:left;
  }
  .success .check{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--yellow);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    box-shadow:0 0 30px rgba(23,166,83,.35);
  }
  .success .check svg{width:26px; height:26px;}
  .success h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    margin-bottom:14px;
    line-height:1.3;
  }
  .success p{
    font-size:15px;
    color:var(--muted);
    line-height:1.65;
    margin-bottom:10px;
    max-width:90%;
  }
  .success .sign{
    margin-top:22px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--yellow);
  }

  @media (max-width:380px){
    .bubble p{font-size:19px;}
    .welcome h1{font-size:24px;}
  }
</style>
</head>
<body>

<div class="app">

  <div class="progress" id="progressBar"></div>

  <div class="header" id="headerRow" style="visibility:hidden;">
    <div class="avatar" id="avatarSmall">G</div>
    <div class="header-name">Diagnóstico com <b>Gustavo</b></div>
  </div>

  <div class="stage" id="stage"></div>

</div>

<script>
/* ======================================================================
   CONFIGURAÇÃO
   Cole aqui a URL do Web App do Apps Script (Passo 6 do tutorial).
   Enquanto estiver vazia, o formulário funciona normalmente mas não
   salva nada — só mostra um aviso no console.
====================================================================== */
const WEBHOOK_URL = ""; // <-- cole aqui a URL que termina em /exec

/* Se você já tiver a foto real do Gustavo hospedada em algum link,
   troque este valor pela URL da imagem. Até lá, fica o "G" neon. */
const GUSTAVO_PHOTO_URL = "";

/* ====================================================================== */

const state = {
  id: "",           // vira o número de whatsapp (sem formatação)
  nome: "",
  whatsapp: "",
  clinica: "",
  cargo: "",
  tempo: "",
  faturamento: "",
  desafio: "",
  prontidao: "",
  status: "Em andamento"
};

const stage = document.getElementById('stage');
const progressBar = document.getElementById('progressBar');
const headerRow = document.getElementById('headerRow');
const avatarSmall = document.getElementById('avatarSmall');

if (GUSTAVO_PHOTO_URL) {
  avatarSmall.innerHTML = `<img src="${GUSTAVO_PHOTO_URL}" alt="Gustavo">`;
}

const TOTAL_STEPS = 8; // nome não conta como "step" de progresso, começa no whatsapp

function buildProgress(){
  progressBar.innerHTML = "";
  for(let i=0;i<TOTAL_STEPS;i++){
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.innerHTML = '<i></i>';
    progressBar.appendChild(seg);
  }
}
buildProgress();

function updateProgress(stepIndex){
  // stepIndex: 0 = nenhum ainda, 1..8 = perguntas concluídas
  const segs = progressBar.querySelectorAll('.seg');
  segs.forEach((seg, idx)=>{
    seg.classList.toggle('done', idx < stepIndex);
  });
}

function sendToSheet(){
  if(!WEBHOOK_URL){
    console.warn("WEBHOOK_URL não configurada ainda — resposta não foi salva.", state);
    return;
  }
  fetch(WEBHOOK_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type":"text/plain"},
    body: JSON.stringify(state)
  }).catch(err => console.error("Erro ao salvar:", err));
}

/* ---------------- transição entre telas ---------------- */
let current = null;
function render(html, {progress = null, showHeader = true} = {}){
  headerRow.style.visibility = showHeader ? 'visible' : 'hidden';
  if(progress !== null) updateProgress(progress);

  const next = document.createElement('div');
  next.className = 'screen';
  next.innerHTML = html;
  stage.appendChild(next);

  requestAnimationFrame(()=> requestAnimationFrame(()=> next.classList.add('active')));

  if(current){
    current.classList.add('leaving');
    current.classList.remove('active');
    setTimeout(()=> current.remove(), 300);
  }
  current = next;
  return next;
}

/* ---------------- steps ---------------- */

function stepWelcome(){
  const el = render(`
    <div class="welcome">
      <div class="avatar-big" id="avatarBig">G</div>
      <h1>Antes da gente <span>conversar</span></h1>
      <p>eu preciso entender um pouco do momento da sua clínica.</p>
      <p>São só algumas perguntas rápidas — leva menos de 2 minutos.</p>
    </div>
  `, {showHeader:false});

  if (GUSTAVO_PHOTO_URL) {
    document.getElementById('avatarBig').innerHTML = `<img src="${GUSTAVO_PHOTO_URL}" alt="Gustavo">`;
  }

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.innerHTML = `<button class="btn" id="startBtn">Começar diagnóstico</button>`;
  el.appendChild(footer);
  document.getElementById('startBtn').onclick = stepNome;
}

function stepNome(){
  const el = render(`
    <div class="bubble"><p>Pra começar, como você se chama?</p></div>
    <input type="text" id="inputNome" placeholder="Seu nome" autocomplete="off">
  `, {progress:0});

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.innerHTML = `<button class="btn" id="nextBtn" disabled>Continuar</button>`;
  el.appendChild(footer);

  const input = document.getElementById('inputNome');
  const btn = document.getElementById('nextBtn');
  input.focus();
  input.addEventListener('input', ()=>{
    btn.disabled = input.value.trim().length < 2;
  });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) go(); });
  btn.onclick = go;

  function go(){
    state.nome = input.value.trim();
    stepWhatsapp();
  }
}

function stepWhatsapp(){
  const primeiroNome = state.nome.split(' ')[0];
  const el = render(`
    <div class="bubble"><p>Perfeito, ${primeiroNome}! Qual seu WhatsApp?</p><div class="sub">É por ele que eu vou te chamar.</div></div>
    <input type="tel" id="inputWpp" placeholder="(00) 00000-0000" autocomplete="off">
    <div class="hint" id="wppHint"></div>
  `, {progress:1});

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.innerHTML = `<button class="btn" id="nextBtn" disabled>Continuar</button>`;
  el.appendChild(footer);

  const input = document.getElementById('inputWpp');
  const btn = document.getElementById('nextBtn');
  input.focus();

  input.addEventListener('input', ()=>{
    input.value = formatPhone(input.value);
    const digits = input.value.replace(/\D/g,'');
    btn.disabled = digits.length < 10;
  });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) go(); });
  btn.onclick = go;

  function go(){
    state.whatsapp = input.value.trim();
    state.id = input.value.replace(/\D/g,'');
    sendToSheet(); // primeiro salvamento — a partir daqui já não se perde o lead
    stepClinica();
  }
}

function formatPhone(v){
  v = v.replace(/\D/g,'').slice(0,11);
  if(v.length > 6) return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  if(v.length > 2) return `(${v.slice(0,2)}) ${v.slice(2)}`;
  return v;
}

function stepClinica(){
  const el = render(`
    <div class="bubble"><p>E qual o nome da sua clínica?</p></div>
    <input type="text" id="inputClinica" placeholder="Nome da clínica" autocomplete="off">
  `, {progress:2});

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.innerHTML = `<button class="btn" id="nextBtn" disabled>Continuar</button>`;
  el.appendChild(footer);

  const input = document.getElementById('inputClinica');
  const btn = document.getElementById('nextBtn');
  input.focus();
  input.addEventListener('input', ()=> btn.disabled = input.value.trim().length < 2);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !btn.disabled) go(); });
  btn.onclick = go;

  function go(){
    state.clinica = input.value.trim();
    sendToSheet();
    stepCargo();
  }
}

function optionStep({question, sub, field, options, progress, next}){
  const optsHtml = options.map((o,i)=>`<button class="opt" data-val="${o}">${o}</button>`).join('');
  const el = render(`
    <div class="bubble"><p>${question}</p>${sub ? `<div class="sub">${sub}</div>`:''}</div>
    <div class="options">${optsHtml}</div>
  `, {progress});

  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.innerHTML = `<button class="btn" id="nextBtn" disabled>Continuar</button>`;
  el.appendChild(footer);

  const btn = document.getElementById('nextBtn');
  let selected = null;
  el.querySelectorAll('.opt').forEach(o=>{
    o.onclick = ()=>{
      el.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
      o.classList.add('selected');
      selected = o.dataset.val;
      btn.disabled = false;
    };
  });
  btn.onclick = ()=>{
    state[field] = selected;
    sendToSheet();
    next();
  };
}

function stepCargo(){
  optionStep({
    question: "Me conta: qual é o seu papel aí na clínica?",
    field: "cargo",
    progress: 3,
    options: ["Sou dono(a)","Sou sócio(a)","Sou gerente ou gestor(a)","Sou investidor(a)","Quero abrir uma clínica","Outro"],
    next: stepTempo
  });
}

function stepTempo(){
  optionStep({
    question: "Há quanto tempo essa clínica existe?",
    field: "tempo",
    progress: 4,
    options: ["Ainda vou abrir","Menos de 1 ano","1 a 3 anos","3 a 5 anos","Mais de 5 anos"],
    next: stepFaturamento
  });
}

function stepFaturamento(){
  optionStep({
    question: "Hoje, quanto sua clínica fatura por mês, mais ou menos?",
    field: "faturamento",
    progress: 5,
    options: ["R$0 a 20 mil","R$20 a 50 mil","R$50 a 80 mil","R$80 a 120 mil","R$120 a 200 mil","Mais de R$200 mil"],
    next: stepDesafio
  });
}

function stepDesafio(){
  optionStep({
    question: "Se você pudesse resolver UMA coisa na sua clínica agora, qual seria?",
    field: "desafio",
    progress: 6,
    options: ["Atrair mais pacientes","Aumentar o faturamento","Organizar a gestão e os processos","Formar e liderar minha equipe","Sair da operação","Outro"],
    next: stepProntidao
  });
}

function stepProntidao(){
  optionStep({
    question: "Última coisa: o quão pronto você está pra dar esse próximo passo?",
    field: "prontidao",
    progress: 7,
    options: ["Pronto pra começar já","Quero entender melhor antes","Só pesquisando por enquanto"],
    next: stepSucesso
  });
}

function stepSucesso(){
  state.status = "Completo";
  sendToSheet();
  updateProgress(8);

  const primeiroNome = state.nome.split(' ')[0];
  render(`
    <div class="success">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Prontinho, ${primeiroNome}!</h1>
      <p>Já recebi tudo por aqui. Vou olhar suas respostas com atenção e te chamar no seu WhatsApp pra gente conversar sobre o próximo passo da sua clínica.</p>
      <p>Até já! 👋</p>
      <div class="sign">— Gustavo</div>
    </div>
  `, {showHeader:true});
}

/* start */
stepWelcome();
</script>

</body>
</html>
